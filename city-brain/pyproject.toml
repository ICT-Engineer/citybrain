[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "city-brain"
version = "0.2.0"
description = "City Brain layer, adapted to the Twin (twin-interface-0.1) and Guardian (v0.4) contracts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "starlette>=0.40,<0.47",          # FastAPI 0.115 breaks on Starlette >= 0.47
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<6",
    "asyncpg>=0.30,<0.31",
    "httpx>=0.27,<0.28",
    # FIX: the decision model is loaded at runtime, so these are runtime deps, not dev-only
    "scikit-learn>=1.5,<2",
    "numpy>=1.26,<2",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.16,<2"]                # TWIN_TRANSPORT=mcp
dev = ["pytest", "pytest-asyncio", "mcp>=1.16,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
city_brain = ["catalog/*.json", "catalog/*.svg", "static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 170
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI Depends() defaults. E702/E731: compact one-liners kept on purpose.
ignore = ["B008", "E702", "E731"]
